<!DOCTYPE html> 
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Assistant - 현대적이고 세련된 AI 챗봇 인터페이스">
    <title>AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .container {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.6s ease-in-out;
        }

        .chat-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 400;
        }

        .chat-container {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0 0 20px 20px;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .container {
                padding: 8px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header {
                padding: 16px;
            }

            .chat-wrapper {
                border-radius: 16px;
            }
        }

        /* 다크 모드 지원 */
        @media (prefers-color-scheme: dark) {
            .chat-wrapper {
                background: rgba(30, 30, 30, 0.95);
            }

            .header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-wrapper">
            <div class="header">
                <h1>🤖 AI Assistant</h1>
                <p>무엇을 도와드릴까요?</p>
            </div>
            <div class="chat-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">로딩 중...</div>
                </div>
                <iframe
                    src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_multimodelaiagent_I4FF9d/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
                    title="AI Assistant Chat">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        // iframe 로딩 완료 후 로딩 표시 제거
        document.querySelector('iframe').addEventListener('load', function() {
            const loading = document.querySelector('.loading');
            if (loading) {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
